<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Das RL-Mobile-Ökosystem</title><desc id="desc">RL-ERP, RL-Office, RL-KABot und RL-Shopware setzen auf RL-Base mit Datenbank, Backup, n8n und HTTPS. RL-Monitor ergänzt das System unabhängig.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<g font-family="Inter,Arial,Helvetica,sans-serif"><rect width="1280" height="520" rx="7" fill="#fcfcfc"/><text x="48" y="55" fill="#74766f" font-size="17" font-weight="500" letter-spacing="2">EIN ÖKOSYSTEM. GEMEINSAME GRUNDLAGE.</text><text x="48" y="98" fill="#262724" font-size="30" font-weight="600" >So greifen die RL-Systeme ineinander.</text><path d="M256 272H1024M640 272V315M256 245V272M512 245V272M768 245V272M1024 245V272" fill="none" stroke="#b6b8b0" stroke-width="2"/><rect x="144" y="151" width="224" height="94" rx="7" fill="#f0f0ef" stroke="#dfe0dd"/><text x="256" y="190" fill="#262724" font-size="23" font-weight="600" text-anchor="middle">RL-ERP</text><text x="256" y="219" fill="#74766f" font-size="16" font-weight="400" text-anchor="middle">Warenwirtschaft</text><rect x="400" y="151" width="224" height="94" rx="7" fill="#f0f0ef" stroke="#dfe0dd"/><text x="512" y="190" fill="#262724" font-size="23" font-weight="600" text-anchor="middle">RL-Office</text><text x="512" y="219" fill="#74766f" font-size="16" font-weight="400" text-anchor="middle">KI-Büro</text><rect x="656" y="151" width="224" height="94" rx="7" fill="#f0f0ef" stroke="#dfe0dd"/><text x="768" y="190" fill="#262724" font-size="23" font-weight="600" text-anchor="middle">RL-KABot</text><text x="768" y="219" fill="#74766f" font-size="16" font-weight="400" text-anchor="middle">Ankaufsworkflows</text><rect x="912" y="151" width="224" height="94" rx="7" fill="#f0f0ef" stroke="#dfe0dd"/><text x="1024" y="190" fill="#262724" font-size="23" font-weight="600" text-anchor="middle">RL-Shopware</text><text x="1024" y="219" fill="#74766f" font-size="16" font-weight="400" text-anchor="middle">Shop &amp; Plugins</text><rect x="144" y="315" width="992" height="96" rx="7" fill="#262724"/><text x="178" y="357" fill="#ffffff" font-size="29" font-weight="500" >RL-Base</text><text x="178" y="385" fill="#dfe0dd" font-size="17" font-weight="400" >Installation · Verwaltung · gemeinsamer Einstieg</text><text x="1102" y="358" fill="#ffffff" font-size="18" font-weight="500" text-anchor="end">RL-DB  /  BACKUP  /  N8N  /  HTTPS</text><text x="1102" y="386" fill="#dfe0dd" font-size="16" font-weight="400" text-anchor="end">Basisdienste zentral bereitgestellt</text><text x="640" y="469" fill="#74766f" font-size="18" font-weight="400" text-anchor="middle">RL-Monitor ergänzt das System mit einem eigenständigen Server-Monitoring.</text></g></svg>